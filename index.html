<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TvOnline Panel - Autenticación y Gestión</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #18181c;
            --card-border: #2a2a30;
            --primary-purple: #7000ff;
            --accent-pink: #d900ff;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            padding: 20px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Vistas */
        #loginView {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-sizing: border-box;
        }

        #panelView {
            display: none;
            width: 100%;
        }

        .brand-title {
            font-size: 26px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            margin-bottom: 20px;
        }
        .brand-title span { color: #00a2ff; font-style: normal; font-size: 16px; }

        /* Estilos de Formulario */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            padding: 12px;
            background: #0d0d0d;
            border: 1px solid var(--card-border);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-pink));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        /* Header del Panel */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-badge {
            background: #1f1f26;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #3a3a45;
            font-size: 12px;
            color: var(--accent-pink);
            font-weight: bold;
        }

        .btn-logout {
            background: #2a2a30;
            color: var(--text-muted);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Balance Card */
        .balance-card { text-align: center; padding: 10px 0; }
        .balance-title { font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }
        .balance-amount { font-size: 36px; font-weight: bold; }

        /* Quick Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-pink));
            border: none;
            border-radius: 12px;
            padding: 14px 8px;
            color: white;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        /* List Cards */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .card-info { display: flex; align-items: center; gap: 12px; }
        .card-title { font-size: 15px; font-weight: 600; }
        .card-subtitle { font-size: 12px; color: var(--text-muted); }

        .add-btn {
            background: #25252e;
            border: 1px solid #404050;
            color: white;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* Info demo credentials */
        .demo-info {
            margin-top: 15px;
            padding: 10px;
            background: #151518;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="loginView">
    <div class="brand-title">TvOnline <span>Panel</span></div>
    
    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="username" placeholder="Ej: mayorista1" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Iniciar Sesión</button>
    </form>

    <div class="demo-info">
        <strong>Acceso de prueba para el profesor:</strong><br>
        • Mayorista: <code>mayorista</code> / <code>1234</code><br>
        • Revendedor: <code>revendedor</code> / <code>1234</code><br>
        • Vendedor: <code>vendedor</code> / <code>1234</code>
    </div>
</div>

<!-- PANTALLA DEL PANEL GENERAL -->
<div id="panelView">
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="brand-title" style="margin:0; text-align:left;">TvOnline <span>Panel</span></div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="user-badge" id="roleBadge">Mayorista</span>
                <button class="btn-logout" onclick="logout()">Salir</button>
            </div>
        </div>

        <!-- Balance Section -->
        <div class="balance-card">
            <div class="balance-title">Total balance 👁️</div>
            <div class="balance-amount" id="balanceDisplay">8,00</div>
        </div>

        <!-- Action Buttons -->
        <div class="actions-grid">
            <button class="btn-action" onclick="alert('Sección Depositar Saldo')">
                <span>⬆️</span> Depositar
            </button>
            <button class="btn-action" onclick="alert('Ventana para Enviar Créditos a sub-cuentas')">
                <span>🔄</span> Enviar
            </button>
            <button class="btn-action" onclick="alert('Carga de código/voucher')">
                <span>📅</span> Cargar
            </button>
        </div>

        <!-- Direct Client Card -->
        <div class="card">
            <div class="card-info">
                <span>👤</span>
                <div>
                    <div class="card-title">Clientes</div>
                    <div class="card-subtitle">12 - total</div>
                </div>
            </div>
            <div class="add-btn" onclick="alert('Crear Cliente Final')">+</div>
        </div>

        <!-- Hierarchy Section (Solo visible para Roles superiores) -->
        <div id="hierarchySection">
            <div style="font-size: 13px; color: var(--text-muted); margin-top: 16px;">SUB-CUENTAS / JERARQUÍA</div>

            <div class="card" id="card-vendedor">
                <div class="card-info">
                    <span>🛍️</span>
                    <div class="card-title" style="color: var(--accent-pink);">Vendedor</div>
                </div>
                <div class="add-btn" onclick="alert('Crear Vendedor')">+</div>
            </div>

            <div class="card" id="card-revendedor">
                <div class="card-info">
                    <span>💼</span>
                    <div class="card-title">Revendedor</div>
                </div>
                <div class="add-btn" onclick="alert('Crear Revendedor')">+</div>
            </div>

            <div class="card" id="card-minorista">
                <div class="card-info">
                    <span>🛒</span>
                    <div class="card-title">Minorista</div>
                </div>
                <div class="add-btn" onclick="alert('Crear Minorista')">+</div>
            </div>

            <div class="card" id="card-mayorista">
                <div class="card-info">
                    <span>🚚</span>
                    <div class="card-title">Mayorista</div>
                </div>
                <div class="add-btn" onclick="alert('Crear Mayorista')">+</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Lógica de inicio de sesión por credenciales
    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.toLowerCase().trim();
        const pass = document.getElementById('password').value.trim();

        if (pass !== '1234') {
            alert('Contraseña incorrecta. (Usar 1234 para pruebas)');
            return;
        }

        let role = '';
        if (user === 'mayorista') role = 'mayorista';
        else if (user === 'revendedor') role = 'revendedor';
        else if (user === 'vendedor' || user === 'minorista') role = 'vendedor';
        else {
            alert('Usuario no reconocido. Prueba con: mayorista, revendedor o vendedor.');
            return;
        }

        // Mostrar Panel y Ocultar Login
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('panelView').style.display = 'block';

        // Configurar la interfaz según el rol que inició sesión
        configureViewForRole(role);
    }

    function configureViewForRole(role) {
        const badge = document.getElementById('roleBadge');
        const hierarchy = document.getElementById('hierarchySection');
        const cardMayorista = document.getElementById('card-mayorista');
        const cardRevendedor = document.getElementById('card-revendedor');

        badge.innerText = role.toUpperCase();

        if (role === 'mayorista') {
            hierarchy.style.display = 'block';
            cardMayorista.style.display = 'flex';
            cardRevendedor.style.display = 'flex';
        } else if (role === 'revendedor') {
            hierarchy.style.display = 'block';
            cardMayorista.style.display = 'none';
            cardRevendedor.style.display = 'none'; // Solo ve Vendedor y Minorista
        } else {
            // Vendedor / Minorista solo ven gestión de clientes finales
            hierarchy.style.display = 'none';
        }
    }

    function logout() {
        document.getElementById('panelView').style.display = 'none';
        document.getElementById('loginView').style.display = 'flex';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }
</script>

</body>
</html>
