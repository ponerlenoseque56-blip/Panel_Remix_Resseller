<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Panel - Acceso al Sistema</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --input-bg: #1a1a1a;
            --primary-red: #e50914;
            --primary-red-hover: #ff1e27;
            --text-color: #ffffff;
            --text-muted: #8c8c8c;
            --border-color: #2a2a2a;
            --error-color: #ff4d4d;
            --glow-red: rgba(229, 9, 20, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(229, 9, 20, 0.12) 0%, transparent 60%);
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8),
                        0 0 20px var(--glow-red);
            position: relative;
            overflow: hidden;
        }

        /* Línea superior roja con brillo */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-red), transparent);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        /* Contenedor del Logo */
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 16px;
            border-radius: 20px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px var(--glow-red);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 18px;
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-color);
            text-transform: uppercase;
        }

        .login-header h1 span {
            color: var(--primary-red);
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px var(--glow-red);
        }

        .password-input {
            padding-right: 48px;
        }

        /* Botón de Ojito */
        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary-red);
        }

        .toggle-password svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-red), #b30000);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--glow-red);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-red-hover), var(--primary-red));
            box-shadow: 0 6px 20px rgba(255, 30, 39, 0.5);
            transform: translateY(-1px);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 16px;
            text-align: center;
            display: none;
            background: rgba(255, 77, 77, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.2);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="logo-container">
                <!-- Tu logo ic_launcher.png (Asegúrate de tener la imagen en la misma carpeta) -->
                <img src="ic_launcher.png" alt="Remix Panel Logo">
            </div>
            <h1>REMIX <span>PANEL</span></h1>
            <p>Ingresa tus credenciales para acceder</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-container">
                    <input type="password" id="password" class="form-control password-input" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar contraseña">
                        <!-- Ojito abierto -->
                        <svg id="eyeOpen" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Ojito tachado -->
                        <svg id="eyeClosed" viewBox="0 0 24 24" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
            <div id="errorMessage" class="error-message">Usuario o contraseña incorrectos.</div>
        </form>
    </div>

    <script>
        // Credenciales predefinidas
        const usersDatabase = {
            'admin': { password: 'admin123', role: 'Administrador' },
            'reseller': { password: 'reseller123', role: 'Revendedor' }
        };

        // Mostrar / Ocultar Contraseña
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                passwordInput.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        // Validación de Login
        function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.style.display = 'none';

            if (usersDatabase[usernameInput] && usersDatabase[usernameInput].password === passwordInput) {
                const userRole = usersDatabase[usernameInput].role;
                alert(`¡Bienvenido a Remix Panel! Has ingresado como ${userRole}.`);
            } else {
                errorMessage.style.display = 'block';
            }
        }
    </script>
</body>
</html>
